name: tests
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --dev --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # These three need PostgreSQL with pgvector and PostGIS, which this
      # workflow does not set up. They run in Replit's full check
      # (pnpm run check). Every other test runs here.
      - run: >-
          uv run pytest
          --ignore=tests/test_auth.py
          --ignore=tests/test_database_guards.py
          --ignore=tests/test_stage1.py
