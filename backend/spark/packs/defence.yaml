# Defence pack: labels and thresholds for a land force.
# First used for Blue Team (docs/WORLD_BRIEF_BLUE_TEAM.md). A pack may relabel
# and add; it may not change or remove anything in backend/spark/model/schema.yaml.
# Rules are plain numbers so an administrator can tune them.
name: defence
harnesses:
  supply_logistics: Sustainment
  people: Readiness and People
  operations: Operations and Plans
  finance: Finance and Capability
  assets: Fleet and Estate
  risk_compliance: Assurance
entities:
  org_unit: Unit
  person: Member
  skill: Qualification
  activity: Operation
  event: Report
rules:
  stockout_warning_days: 60
  certification_expiry_warning_days: 90
  minimum_certified_share: 0.9
  availability_floor: 0.85
