# Free models already used by DDG Finance (model IDs read from its code,
# kraken-bot/forex_council.py, 19 November 2026). Free tiers have small daily
# limits and the provider may keep what is sent: synthetic data only.
# context_size is set low on purpose until checked against the provider.
[models.free_reason]
provider = "gemini"
model_id = "gemini-3-flash-preview"
max_sensitivity = "internal"
price_input_per_million = 0.0
price_output_per_million = 0.0
context_size = 32000
supports_tools = true
runs_locally = false

[models.free_work]
